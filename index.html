<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Переадресация…</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      max-width: 900px;
      width: 100%;
      padding: 32px 16px;
      animation: fadeIn 0.6s ease;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      font-weight: 600;
    }

    p {
      margin: 0 0 20px;
      opacity: 0.85;
      line-height: 1.6;
    }

    a.btn {
      background: #fff;
      color: #000;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
      display: inline-block;
    }

    a.btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 28px rgba(0,0,0,0.45);
      opacity: 0.95;
    }

    .preview {
      margin-top: 28px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.15);
      height: 60vh;
    }

    .preview iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Переадресация</h1>
    <p id="redirect-text">Сейчас вы будете автоматически перенаправлены на сайт <strong>up.statuser.cloud/s/ga1maz</strong> через 5 секунд</p>

    <a class="btn" href="https://up.statuser.cloud/s/ga1maz" rel="noopener">Перейти сразу</a>

    <div class="preview">
      <iframe src="https://up.statuser.cloud/s/ga1maz" loading="lazy"></iframe>
    </div>
  </div>

  <script>
    let countdown = 5;
    const p = document.getElementById('redirect-text');

    function getSecondsText(n) {
      if (n % 10 === 1 && n !== 11) return n + ' секунда';
      if ([2,3,4].includes(n % 10) && ![12,13,14].includes(n)) return n + ' секунды';
      return n + ' секунд';
    }

    const interval = setInterval(() => {
      countdown--;
      p.innerHTML = `Сейчас вы будете автоматически перенаправлены на сайт <strong>up.statuser.cloud/s/ga1maz</strong> через ${getSecondsText(countdown)}`;
      if (countdown === 0) {
        clearInterval(interval);
        window.location.href = 'https://up.statuser.cloud/s/ga1maz';
      }
    }, 1000);
  </script>
</body>
</html>
